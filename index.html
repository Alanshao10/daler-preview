<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Варианты сайта · Nowrozuddin Zazai</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b0b;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .bar{position:fixed;inset:0 0 auto 0;height:60px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#141414;border-bottom:1px solid #2c2c2c;z-index:5;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .bar .t{color:#9a9a9a;font-size:15px;white-space:nowrap;padding-right:4px}
  .bar button{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #3a3a3a;background:#1d1d1d;color:#f1f1f1;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px}
  .bar button i{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.35)}
  .bar button[aria-pressed="true"]{background:#f1f1f1;color:#111;border-color:#f1f1f1}
  iframe{position:fixed;top:60px;left:0;width:100%;height:calc(100% - 60px);border:0;background:#000}
</style>
</head>
<body>
<div class="bar" role="tablist" aria-label="Варианты сайта">
  <span class="t">Вариант:</span>
  <button data-v="a" aria-pressed="true"><i style="background:#0f7a50"></i>A · Изумруд</button>
  <button data-v="b" aria-pressed="false"><i style="background:#c2611a"></i>B · Медь и жёлть</button>
  <button data-v="c" aria-pressed="false"><i style="background:#1f64a3"></i>C · Сталь</button>
</div>
<iframe id="f" title="Вариант сайта" src="a/" allow="autoplay; fullscreen"></iframe>
<script>
(function(){
  var f=document.getElementById('f'),bs=document.querySelectorAll('.bar button');
  function show(v){
    if(['a','b','c'].indexOf(v)<0)v='a';
    f.src=v+'/';
    for(var i=0;i<bs.length;i++)bs[i].setAttribute('aria-pressed',bs[i].dataset.v===v?'true':'false');
    try{history.replaceState(null,'','#'+v)}catch(e){}
  }
  for(var i=0;i<bs.length;i++)bs[i].addEventListener('click',function(){show(this.dataset.v)});
  var h=(location.hash||'').replace('#','');
  if(h)show(h);
})();
</script>
</body>
</html>
